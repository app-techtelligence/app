[package]
name = "mosaico-spike-pty"
version = "0.0.0"
edition = "2021"
publish = false
description = "M1 spike: a local PTY bridge over a loopback WebSocket. Throwaway."

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
getrandom = "0.4"
portable-pty = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
opt-level = 2
